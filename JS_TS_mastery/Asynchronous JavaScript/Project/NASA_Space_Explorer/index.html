<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NASA Astronomy Picture</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        "Segoe UI",
        Roboto,
        system-ui,
        -apple-system,
        sans-serif;
      background: #b8bcd1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      background-image: radial-gradient(
        circle at 10% 20%,
        #536182,
        #03050b 90%
      );
    }

    .nasa-card {
      max-width: 820px;
      width: 100%;
      background: rgba(49, 90, 203, 0.8);

      border-radius: 1.5rem;
      padding: 2rem 2.2rem 2.2rem;
      box-shadow:
        0 30px 50px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(70, 150, 255, 0.15);
      border: 1px solid rgba(80, 160, 255, 0.15);
    }

    .nasa-title {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1.6rem;
      border-bottom: 1px solid rgba(100, 180, 255, 0.15);
      padding-bottom: 0.8rem;
      flex-wrap: wrap;
      justify-content: center; 
    }

    .nasa-title h1 {
      font-weight: 500;
      font-size: 1.7rem;
      letter-spacing: 0.5px;
      text-align: center; /* This is all you need for text centering */
    }

    .image-wrapper {
      background: #0b1428;
      border-radius: 1.8rem;
      overflow: hidden;
      margin-bottom: 1.4rem;
      border: 1px solid #2a4b7a;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 260px;
      position: relative;
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      max-height: 400px;
    }
    .info-block {
      margin: 0.8rem 0 1rem;
    }

    .info-block h2 {
      font-weight: 500;
      font-size: 1.6rem;
      color: #e3efff;
      letter-spacing: 0.3px;
      margin-bottom: 0.25rem;
      line-height: 1.3;
    }
    .info-block .date {
      color: #b6c9e7;
      font-size: 0.95rem;
      background: rgba(0, 30, 70, 0.4);
      display: inline-block;
      padding: 0.15rem 1.2rem;
      border-radius: 30px;
      border: 1px solid #2d5f96;
    }

    .explanation {
      background: rgba(137, 157, 200, 0.5);

      border-radius: 1.8rem;
      padding: 1.4rem 1.7rem;
      margin: 1.2rem 0 1.8rem;
      border-left: 3px solid #ff914d;
      border: 1px solid #2a4e7a;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: transparent;
      border: 1.5px solid #4d89db;
      color: #d3e7ff;
      padding: 0.7rem 1.8rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      backdrop-filter: blur(4px);
      background: rgba(10, 30, 70, 0.25);
      letter-spacing: 0.3px;
      flex: 1;
      justify-content: center;
      min-width: 120px;
    }

    .nav-btn:hover {
      background: #1f4d91;
      border-color: #7bb0ff;
      box-shadow: 0 0 20px #2a6ed4;
      color: white;
      transform: scale(1.01);
    }
  </style>
  <body>
    <div class="nasa-card">
      <div class="nasa-title">
        <h1  class="title">NASA Astronomy Picture</h1>
      </div>

      <div class="image-wrapper">
        <img id="nasaImage"
          src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=800&h=500&fit=crop&crop=center&q=80"
          alt="Space image from NASA"
        />
        
      </div>

      <div class="info-block">
        <h2 id="imageName" class="image-name">Pillars of Creation · Eagle Nebula</h2>
        <div id="imageDate" class="date">April 12, 2026</div>
      </div>

      <div class="explanation">
        <p id="imageExplanation" class="content">
          This iconic image shows towering columns of cosmic dust and gas in the
          Eagle Nebula, about 6,500 light‑years away. New stars are born within
          these pillars, sculpted by stellar winds and radiation from massive
          young stars.
        </p>
      </div>

      <div class="nav-buttons">
        <button class="nav-btn" id="prevBtn">Previous</button>
        <button class="nav-btn" id="nextBtn">Next</button>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
